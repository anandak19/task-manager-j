<main class="tasks-list-page">
  <header class="tasks-list-page__header">
    <h2 class="tasks-list-page__title">Tasks</h2>

    <button class="btn btn-primary btn-sm" type="button" (click)="navigateCreateTask()">
      Create Task
    </button>
  </header>

  <section class="tasks-list-page__listing" aria-labelledby="tasks-list-heading">
    <ul class="tasks-list-page__list">
      @for (task of tasks(); track $index) {
        <li class="tasks-list-page__item">
          <app-task-card [task]="task"></app-task-card>
        </li>
      }
    </ul>
  </section>
</main>
